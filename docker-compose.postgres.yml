services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    environment:
      - DATABASE_URL=postgresql+psycopg://legal:${POSTGRES_PASSWORD:-legal}@postgres:5432/legal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
