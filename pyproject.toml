[project]
name = "banking-legal-mvp"
version = "0.1.0"
description = "Chat-first Vietnamese legal document search assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
ocr = [
  "paddleocr>=2.8,<3",
  "paddlepaddle>=2.6,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
